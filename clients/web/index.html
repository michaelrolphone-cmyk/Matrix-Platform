<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Matrix Client - Top-down Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #050510;
      color: #eee;
      font-family: system-ui, sans-serif;
      height: 100%;
      overflow: hidden;
    }
    #ui {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
      pointer-events: none;
    }
    #status {
      font-size: 12px;
      opacity: 0.7;
    }
    #help {
      font-size: 12px;
      opacity: 0.7;
      text-align: right;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="status">Connecting...</div>
    <div id="help">W/A/S/D to move (top-down)</div>
  </div>
  <canvas id="view"></canvas>

  <script>
    const statusEl = document.getElementById("status");
    const canvas = document.getElementById("view");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // ---------------------------
    // WebSocket connection
    // ---------------------------

    const WS_URL =
  (location.protocol === "https:" ? "wss://" : "ws://") + location.host;

    let socket = null;
    let lastFrame = null;

    function connect() {
      socket = new WebSocket(WS_URL);

      socket.addEventListener("open", () => {
        statusEl.textContent = "Connected";
      });

      socket.addEventListener("close", () => {
        statusEl.textContent = "Disconnected";
      });

      socket.addEventListener("error", (err) => {
        console.error("WS error", err);
        statusEl.textContent = "Error";
      });

      socket.addEventListener("message", (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === "frame") {
            lastFrame = msg.frame;
          }
        } catch (e) {
          console.error("Error parsing message", e);
        }
      });
    }

    connect();

    // ---------------------------
    // Input handling (WASD → move vector)
// ---------------------------

    const keys = {
      w: false,
      a: false,
      s: false,
      d: false
    };

    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k in keys) {
        keys[k] = true;
        e.preventDefault();
      }
    });

    window.addEventListener("keyup", (e) => {
      const k = e.key.toLowerCase();
      if (k in keys) {
        keys[k] = false;
        e.preventDefault();
      }
    });

    function currentMoveVector() {
      let x = 0;
      let z = 0;

      if (keys.w) z -= 1;
      if (keys.s) z += 1;
      if (keys.a) x -= 1;
      if (keys.d) x += 1;

      // Normalize
      const mag = Math.hypot(x, z);
      if (mag > 0) {
        x /= mag;
        z /= mag;
      }
      return [x, 0, z];
    }

    // Send input periodically
    setInterval(() => {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      const move = currentMoveVector();

      socket.send(
        JSON.stringify({
          type: "input",
          move: move
        })
      );
    }, 50);

    // ---------------------------
    // Simple rendering
    // ---------------------------

    function render() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const scale = 5; // pixels per meter

      // Draw foam / semantic field as a heatmap centered on self
      const patch = lastFrame.foamPatch;
      if (patch && patch.width > 0 && patch.height > 0) {
        const halfW = patch.width / 2;
        const halfH = patch.height / 2;
        const cellPixel = patch.cellSize * scale;

        for (let py = 0; py < patch.height; py++) {
          const row = patch.values[py];
          if (!row) continue;
          for (let px = 0; px < patch.width; px++) {
            const v = row[px] || 0;
            if (v <= 0.001) continue;

            // Map foam intensity to alpha
            const alpha = Math.max(0, Math.min(1, v * 0.8));

            ctx.fillStyle = `rgba(0, 150, 255, ${alpha})`;

            // Patch is centered on the player: dx/dz are offsets
            const dx = (px - halfW + 0.5) * cellPixel;
            const dz = (py - halfH + 0.5) * cellPixel;

            const x = cx + dx;
            const y = cy + dz;

            ctx.fillRect(
              x - cellPixel / 2,
              y - cellPixel / 2,
              cellPixel,
              cellPixel
            );
          }
        }
      }

      // Draw background grid (optional)
      ctx.strokeStyle = "rgba(255,255,255,0.04)";
      ctx.lineWidth = 1;
      const gridSpacing = 50;
      for (let x = cx % gridSpacing; x < canvas.width; x += gridSpacing) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = cy % gridSpacing; y < canvas.height; y += gridSpacing) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Draw self at center
      ctx.fillStyle = "#00ff99";
      ctx.beginPath();
      ctx.arc(cx, cy, 8, 0, Math.PI * 2);
      ctx.fill();

    }

    render();
  </script>
</body>
</html>
