<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Matrix Client - Top-down Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #050510;
      color: #eee;
      font-family: system-ui, sans-serif;
      height: 100%;
      overflow: hidden;
    }
    #ui {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
      pointer-events: none;
    }
    #status {
      font-size: 12px;
      opacity: 0.7;
    }
    #help {
      font-size: 12px;
      opacity: 0.7;
      text-align: right;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="status">Connecting...</div>
    <div id="help">W/A/S/D to move (top-down)</div>
  </div>
  <canvas id="view"></canvas>

  <script>
    const statusEl = document.getElementById("status");
    const canvas = document.getElementById("view");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // ---------------------------
    // WebSocket connection
    // ---------------------------

    const WS_URL =
  (location.protocol === "https:" ? "wss://" : "ws://") + location.host;

    let socket = null;
    let lastFrame = null;

    function connect() {
      socket = new WebSocket(WS_URL);

      socket.addEventListener("open", () => {
        statusEl.textContent = "Connected";
      });

      socket.addEventListener("close", () => {
        statusEl.textContent = "Disconnected";
      });

      socket.addEventListener("error", (err) => {
        console.error("WS error", err);
        statusEl.textContent = "Error";
      });

      socket.addEventListener("message", (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === "frame") {
            lastFrame = msg.frame;
          }
        } catch (e) {
          console.error("Error parsing message", e);
        }
      });
    }

    connect();

    // ---------------------------
    // Input handling (WASD → move vector)
// ---------------------------

    const keys = {
      w: false,
      a: false,
      s: false,
      d: false
    };

    const conceptLabels = {
      "1": "curiosity",
      "2": "danger",
      "3": "calm"
    };
    
    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
    
      // Movement keys
      if (k in keys) {
        keys[k] = true;
        e.preventDefault();
        return;
      }
    
      // Concept injection keys (1,2,3)
      if (conceptLabels[e.key] && socket && socket.readyState === WebSocket.OPEN) {
        socket.send(
          JSON.stringify({
            type: "concept",
            label: conceptLabels[e.key]
          })
        );
        e.preventDefault();
        return;
      }
    });


    window.addEventListener("keyup", (e) => {
      const k = e.key.toLowerCase();
      if (k in keys) {
        keys[k] = false;
        e.preventDefault();
      }
    });

    function currentMoveVector() {
      let x = 0;
      let z = 0;

      if (keys.w) z -= 1;
      if (keys.s) z += 1;
      if (keys.a) x -= 1;
      if (keys.d) x += 1;

      // Normalize
      const mag = Math.hypot(x, z);
      if (mag > 0) {
        x /= mag;
        z /= mag;
      }
      return [x, 0, z];
    }

    // Send input periodically
    setInterval(() => {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      const move = currentMoveVector();

      socket.send(
        JSON.stringify({
          type: "input",
          move: move
        })
      );
    }, 50);

    // ---------------------------
    // Simple rendering
    // ---------------------------
function render() {
  requestAnimationFrame(render);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!lastFrame) {
    ctx.fillStyle = "#666";
    ctx.font = "16px system-ui";
    ctx.fillText("Waiting for frame...", 20, 40);
    return;
  }

const {
  self,
  nearbyEntities,
  foamPatch,
  concepts,
  resonance,
  graphSummary,
  narrative,
  worldMood
} = lastFrame;



  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const scale = 5; // pixels per meter

  // ---- Foam / semantic field heatmap ----
  if (foamPatch && foamPatch.width > 0 && foamPatch.height > 0) {
    const halfW = foamPatch.width / 2;
    const halfH = foamPatch.height / 2;
    const cellPixel = foamPatch.cellSize * scale;

    for (let py = 0; py < foamPatch.height; py++) {
      const row = foamPatch.values[py];
      if (!row) continue;
      for (let px = 0; px < foamPatch.width; px++) {
        const v = row[px] || 0;
        if (v <= 0.001) continue;

        const alpha = Math.max(0, Math.min(1, v * 0.8));
        ctx.fillStyle = `rgba(0, 150, 255, ${alpha})`;

        const dx = (px - halfW + 0.5) * cellPixel;
        const dz = (py - halfH + 0.5) * cellPixel;

        const x = cx + dx;
        const y = cy + dz;

        ctx.fillRect(
          x - cellPixel / 2,
          y - cellPixel / 2,
          cellPixel,
          cellPixel
        );
      }
    }
  }

  // ---- Background grid ----
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  ctx.lineWidth = 1;
  const gridSpacing = 50;
  for (let x = cx % gridSpacing; x < canvas.width; x += gridSpacing) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = cy % gridSpacing; y < canvas.height; y += gridSpacing) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }

  // ---- Self ----
  ctx.fillStyle = "#00ff99";
  ctx.beginPath();
  ctx.arc(cx, cy, 8, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.font = "12px system-ui";
  ctx.fillText(`You (entity ${self.id})`, cx + 12, cy - 12);

  // ---- Nearby entities ----
  ctx.fillStyle = "#ff4080";
  if (Array.isArray(nearbyEntities)) {
    for (const ent of nearbyEntities) {
      const dx = ent.relativePosition[0];
      const dz = ent.relativePosition[2];
      const ex = cx + dx * scale;
      const ey = cy + dz * scale;

      ctx.beginPath();
      ctx.arc(ex, ey, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

    // ---- Thought inspector ----
  if (Array.isArray(concepts) && concepts.length > 0) {
    ctx.fillStyle = "#0ff";
    ctx.font = "12px system-ui";
    ctx.fillText("Thoughts (nearby concepts):", 20, canvas.height - 90);

    let y = canvas.height - 75;
    const maxShown = 4;
    for (let i = 0; i < Math.min(concepts.length, maxShown); i++) {
      const c = concepts[i];
      ctx.fillText(
        `${c.label}: ${c.strength.toFixed(2)}`,
        20,
        y
      );
      y += 14;
    }
  }

    // ---- Thought graph inspector ----
  if (graphSummary) {
    const { concepts: conceptNodes, edges } = graphSummary;

    ctx.fillStyle = "#ff0";
    ctx.font = "12px system-ui";

    // Right-side panel
    const panelX = canvas.width - 260;
    let y = 40;

    ctx.fillText("Global Concepts:", panelX, y);
    y += 14;
    if (Array.isArray(conceptNodes) && conceptNodes.length > 0) {
      for (let i = 0; i < Math.min(conceptNodes.length, 5); i++) {
        const c = conceptNodes[i];
        ctx.fillText(
          `${c.label}: ${c.weight.toFixed(0)}`,
          panelX,
          y
        );
        y += 14;
      }
    } else {
      ctx.fillText("(none yet)", panelX, y);
      y += 14;
    }

    y += 10;
    ctx.fillText("Top Concept Links:", panelX, y);
    y += 14;

    if (Array.isArray(edges) && edges.length > 0) {
      for (let i = 0; i < Math.min(edges.length, 5); i++) {
        const e = edges[i];
        ctx.fillText(
          `${e.a} ↔ ${e.b}: ${e.weight.toFixed(0)}`,
          panelX,
          y
        );
        y += 14;
      }
    } else {
      ctx.fillText("(none yet)", panelX, y);
    }
  }

  // ---- Narrative log (inner voice of shard) ----
  if (Array.isArray(narrative) && narrative.length > 0) {
    ctx.fillStyle = "#0f0";
    ctx.font = "12px system-ui";

    const x = 20;
    let y = 60;

    ctx.fillText("Shard narrative:", x, y);
    y += 14;

    for (let i = 0; i < narrative.length; i++) {
      ctx.fillText(`- ${narrative[i]}`, x, y);
      y += 14;
    }
  }


  // ---- HUD ----
  ctx.fillStyle = "#ccc";
  ctx.font = "12px system-ui";
  ctx.fillText(
    `t=${lastFrame.timeSeconds.toFixed(2)}s  tick=${lastFrame.tick}`,
    20,
    canvas.height - 40
  );
  // Player mood + world mood
  const moodText = self.mood ? `mood: ${self.mood}` : "mood: neutral";
  const wm = worldMood || "world mood: unknown";

  ctx.fillStyle = "#9cf";
  ctx.fillText(moodText, 20, canvas.height - 26);

  ctx.fillStyle = "#fcf29f";
  ctx.fillText(`world mood: ${wm}`, 20, canvas.height - 12);

    // ---- Resonance HUD ----
  if (resonance) {
    ctx.fillStyle = "#0ff";
    ctx.font = "12px system-ui";
    const baseY = canvas.height - 80;
    ctx.fillText(`Resonance (local): ${resonance.local.toFixed(2)}`, 20, baseY);

    let y = baseY + 14;
    const labelEntries = Object.entries(resonance.labels)
      .filter(([_, v]) => v > 0.01)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 4);
    for (const [label, value] of labelEntries) {
      ctx.fillText(`${label}: ${value.toFixed(2)}`, 20, y);
      y += 14;
    }
  }

}


    render();
  </script>
</body>
</html>
